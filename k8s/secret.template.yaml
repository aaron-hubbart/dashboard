# DO NOT commit real values. Use the kubectl command in the runbook.
# This file is a reference template only.
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: tam-dashboard
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE"
  AZURE_CLIENT_ID: "REPLACE"
  AZURE_CLIENT_SECRET: "REPLACE"
  AZURE_TENANT_ID: "REPLACE"
  SESSION_SECRET: "REPLACE-32-chars"
  ZOOM_TOKEN: "REPLACE"  # Zoom OAuth access token; get from marketplace.zoom.us
  ZOOM_WEBHOOK_SECRET: "REPLACE"
  # Must be the exact same value as daily-brief-v2's INTERNAL_SSO_SECRET
  # (its own Secret, in the daily-brief-v2 namespace — Kubernetes Secrets
  # don't cross namespaces, so this has to be copied by hand). Leave unset
  # to keep this app standalone; see proxy/server.js's "Shared SSO" comment.
  INTERNAL_SSO_SECRET: "REPLACE-same-value-as-daily-brief-v2s-INTERNAL_SSO_SECRET"
